# Template only (not in kustomization.yaml). Create the real Secret out of band:
#   kubectl -n predictive-maintenance create secret generic pdm-secrets \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 16)" --from-literal=API_TOKEN="$(openssl rand -hex 16)"
apiVersion: v1
kind: Secret
metadata:
  name: pdm-secrets
  namespace: predictive-maintenance
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  API_TOKEN: change-me
